# ═══════════════════════════════════════════
# NSO User Instance — nginx config
# Deploy on: user-facing VPS
# NSO_SERVER_MODE=user
# ═══════════════════════════════════════════

upstream nso_api {
    server 127.0.0.1:8000;
}

upstream nso_agent {
    server 127.0.0.1:8081;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name nso.dev *.nso.dev;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nso.dev;

    # SSL (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/nso.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nso.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Block admin routes entirely at nginx level
    location /api/admin/ {
        return 404;
    }

    # User API routes
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://nso_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://nso_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Agent (auth, files, exec, metrics)
    location /agent/ {
        proxy_pass http://nso_agent/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # User dashboard
    location / {
        root /opt/nso/client/dashboard/static;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) { deny all; }
}
