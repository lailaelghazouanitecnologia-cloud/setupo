# z86 — Object Storage + Agent reverse proxy
# Install on the z86 VPS (filesystem-prod)

server {
    listen 80;
    server_name z86.nso.dev;

    # z86 Agent (remote management) → :8083
    location /agent/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # z86 Health check (public)
    location /health {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
    }

    # z86 Admin API (Bearer token auth) → :8082
    location /admin/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # S3-compatible API (AWS4-HMAC-SHA256 auth) → :8082
    # Handles: PUT/GET/DELETE/HEAD /{bucket}/{key}
    #          GET /{bucket}?prefix=...
    location / {
        client_max_body_size 500M;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
