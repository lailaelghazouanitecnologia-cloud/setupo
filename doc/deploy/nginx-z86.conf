# z86 — Object Storage Service (NSO project)
# VPS: filesystem-prod (104.156.227.216)
# Domains: z86.dev (public), z86.nso.dev (NSO subdomain)
#
# z86 is managed as a project within NSO (nso.dev)
#
# Routing:
#   z86.dev / z86.nso.dev
#     /              → Static landing page (Next.js export)
#     /agent/*       → z86 Agent (:8083)
#     /health        → z86 Storage health (:8082)
#     /admin/*       → z86 Storage admin (:8082)
#   s3.z86.dev       → S3-compatible API (:8082)

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    server_name z86.dev z86.nso.dev s3.z86.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── S3 API (s3.z86.dev) ──
server {
    listen 443 ssl http2;
    server_name s3.z86.dev;

    ssl_certificate /etc/letsencrypt/live/z86.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/z86.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 500M;

    # S3-compatible API (AWS4-HMAC-SHA256 auth) → :8082
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}

# ── Main site (z86.dev + z86.nso.dev) ──
server {
    listen 443 ssl http2;
    server_name z86.dev z86.nso.dev;

    ssl_certificate /etc/letsencrypt/live/z86.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/z86.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── z86 Agent (remote management, accessed by NSO central) → :8083 ──
    location /agent/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # ── z86 Health check ──
    location /health {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
    }

    # ── z86 Admin API → :8082 ──
    location /admin/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Landing page (static, SPA fallback) ──
    location / {
        root /opt/nso/client/z86/static;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Block dotfiles
    location ~ /\.(?!well-known) { deny all; }
}
