# ═══════════════════════════════════════════
# NSO Admin Instance — nginx config
# Deploy on: admin VPS only
# NSO_SERVER_MODE=admin
# ═══════════════════════════════════════════

upstream nso_api {
    server 127.0.0.1:8000;
}

upstream nso_agent {
    server 127.0.0.1:8081;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Allowed admin IPs (update with your IP)
geo $admin_allowed {
    default         0;
    127.0.0.1       1;
    # Add your IP(s) here:
    # 203.0.113.10  1;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name sonfazt.nso.dev;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sonfazt.nso.dev;

    # SSL (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/sonfazt.nso.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonfazt.nso.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # IP restriction — all routes
    if ($admin_allowed = 0) {
        return 403;
    }

    # Admin API (all admin routes)
    location /api/admin/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://nso_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Auth endpoint (admin login)
    location /api/auth/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://nso_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (for monitoring)
    location /api/health {
        proxy_pass http://nso_api;
        proxy_set_header Host $host;
    }

    # Agent access (admin manages agents)
    location /agent/ {
        proxy_pass http://nso_agent/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Block all other API routes
    location /api/ {
        return 403;
    }

    # Admin dashboard
    location / {
        root /opt/nso/client/admin/static;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) { deny all; }
}
