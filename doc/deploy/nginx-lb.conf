# ── NSO Load Balancer nginx config ──
# Runs on admin VPS — routes traffic to backend API servers
# Usage: include this in the main nginx config or use as a standalone server block
#
# The upstream blocks can be auto-generated via:
#   curl -H "X-Admin-Secret: $SECRET" https://sonfazt.nso.dev/api/admin/lb/nginx/config
#
# After regeneration, reload nginx:
#   sudo nginx -t && sudo systemctl reload nginx

# ── Rate limiting zones ──
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# ── API server pool ──
# Replace with actual backend IPs. Auto-generated from /api/admin/lb/nginx/upstreams
upstream nso_api_pool {
    least_conn;

    # Backend servers (API instances running server/ on :8000)
    # server 10.0.0.1:8000 weight=1;
    # server 10.0.0.2:8000 weight=1;
    # server 10.0.0.3:8000 weight=2;   # Higher capacity node

    # Keepalive connections to backends
    keepalive 32;
}

# ── Agent pool (per-VPS agents on :8081) ──
upstream nso_agent_pool {
    ip_hash;   # Sticky sessions — agent requests must hit the same VPS

    # server 10.0.0.1:8081;
    # server 10.0.0.2:8081;

    keepalive 16;
}

# ── Admin server (redirect to HTTPS) ──
server {
    listen 80;
    server_name sonfazt.nso.dev;
    return 301 https://$host$request_uri;
}

# ── Admin server (HTTPS) ──
server {
    listen 443 ssl http2;
    server_name sonfazt.nso.dev;

    ssl_certificate /etc/letsencrypt/live/sonfazt.nso.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonfazt.nso.dev/privkey.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Health check (no auth, no LB — local only) ──
    location = /api/health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Admin panel routes — local only, never load balanced ──
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Auth endpoints — rate limited ──
    location /api/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;

        proxy_pass http://nso_api_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── API routes — load balanced ──
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://nso_api_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # Retry on backend failure
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    # ── WebSocket — load balanced with upgrade ──
    location /ws/ {
        proxy_pass http://nso_api_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ── Agent routes — sticky sessions (ip_hash) ──
    location /agent/ {
        proxy_pass http://nso_agent_pool/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # ── Dashboard ──
    location / {
        root /opt/nso/client/dashboard/static;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
}

# ── User-facing server (nso.dev) ──
server {
    listen 80;
    server_name nso.dev *.nso.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nso.dev *.nso.dev;

    ssl_certificate /etc/letsencrypt/live/nso.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nso.dev/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block admin routes
    location /api/admin/ {
        return 404;
    }

    location = /api/health {
        proxy_pass http://nso_api_pool;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://nso_api_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://nso_api_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location /ws/ {
        proxy_pass http://nso_api_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /agent/ {
        proxy_pass http://nso_agent_pool/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        root /opt/nso/client/dashboard/static;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }
}
