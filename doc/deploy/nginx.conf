upstream nso_api {
    server 127.0.0.1:8000;
}

upstream nso_agent {
    server 127.0.0.1:8081;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# HTTP → HTTPS redirect (keep ACME challenge for cert renewal)
server {
    listen 80;
    server_name nso.dev *.nso.dev;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nso.dev;

    # SSL (managed by certbot — do not edit manually)
    ssl_certificate /etc/letsencrypt/live/nso.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nso.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # API
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://nso_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://nso_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Agent (auth, files, exec, metrics)
    location /agent/ {
        proxy_pass http://nso_agent/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Docs
    location /docs { proxy_pass http://nso_api; }
    location /openapi.json { proxy_pass http://nso_api; }

    # Dashboard (static HTML/CSS/JS)
    location / {
        root /opt/nso/client/dashboard/static;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Block dotfiles
    location ~ /\.(?!well-known) { deny all; }
}

# ═══════════════════════════════════════════
# sonfazt.nso.dev — Admin Panel
# ═══════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name sonfazt.nso.dev;

    # SSL (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/sonfazt.nso.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonfazt.nso.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Admin API routes
    location /api/admin/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://nso_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Auth endpoint (needed for admin login)
    location /api/auth/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://nso_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block all other API routes from admin subdomain
    location /api/ {
        return 403;
    }

    # Admin dashboard (static HTML/CSS/JS)
    location / {
        root /opt/nso/client/admin/static;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Block dotfiles
    location ~ /\.(?!well-known) { deny all; }
}
