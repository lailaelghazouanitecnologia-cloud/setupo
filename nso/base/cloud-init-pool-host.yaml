#cloud-config
# NSO Pool Host — cloud-init bootstrap
# This runs on HOST machines that run user VMs/containers.
# DIFFERENT from user instances: this is the hypervisor, not the tenant.
#
# Security model:
#   - Host runs Docker for VM isolation
#   - Agent runs as root (needs Docker + cgroup access) but binds to 127.0.0.1
#   - Nginx reverse-proxies agent and restricts access by IP
#   - UFW blocks everything except SSH and VM port ranges
#   - Each VM gets its own Docker network (no cross-tenant traffic)
#   - Agent authenticates via pool token (not user-facing)

package_update: true
package_upgrade: true

packages:
  - python3-pip
  - python3-venv
  - git
  - curl
  - ufw
  - jq
  - unzip
  - fail2ban
  - iptables-persistent
  - apparmor
  - apparmor-utils

runcmd:
  # ── 1. Firewall (strict) ──
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH'
  # VM port range — these are the only ports users can reach
  - ufw allow 10000:60000/tcp comment 'VM port range'
  # Agent port — ONLY from central server IP
  - ufw allow from {{CENTRAL_SERVER_IP}} to any port 8081 proto tcp comment 'NSO Central'
  - ufw --force enable

  # ── 2. Fail2ban ──
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # ── 3. Docker (for VM isolation) ──
  - curl -fsSL https://get.docker.com | sh

  # Docker daemon hardening
  - mkdir -p /etc/docker
  - |
    cat > /etc/docker/daemon.json << 'DOCKER_CONF'
    {
      "userns-remap": "default",
      "no-new-privileges": true,
      "icc": false,
      "live-restore": true,
      "userland-proxy": false,
      "log-driver": "json-file",
      "log-opts": {
        "max-size": "10m",
        "max-file": "3"
      },
      "default-ulimits": {
        "nofile": { "Name": "nofile", "Hard": 2048, "Soft": 1024 },
        "nproc": { "Name": "nproc", "Hard": 512, "Soft": 256 }
      },
      "storage-driver": "overlay2"
    }
    DOCKER_CONF

  - systemctl restart docker
  - systemctl enable docker

  # Pull base image now (so first VM creation is fast)
  - docker pull ubuntu:22.04

  # ── 4. Kernel hardening (sysctl) ──
  - |
    cat > /etc/sysctl.d/99-nso-pool-hardening.conf << 'SYSCTL'
    # Prevent IP spoofing
    net.ipv4.conf.all.rp_filter = 1
    net.ipv4.conf.default.rp_filter = 1

    # Disable source routing
    net.ipv4.conf.all.accept_source_route = 0
    net.ipv4.conf.default.accept_source_route = 0

    # Disable ICMP redirects
    net.ipv4.conf.all.accept_redirects = 0
    net.ipv4.conf.default.accept_redirects = 0
    net.ipv4.conf.all.send_redirects = 0

    # Enable SYN cookies (SYN flood protection)
    net.ipv4.tcp_syncookies = 1

    # Log martian packets
    net.ipv4.conf.all.log_martians = 1

    # Disable IPv6 (unless needed)
    net.ipv6.conf.all.disable_ipv6 = 1
    net.ipv6.conf.default.disable_ipv6 = 1

    # Limit PID allocation
    kernel.pid_max = 65536

    # Restrict dmesg access
    kernel.dmesg_restrict = 1

    # Restrict kernel pointer exposure
    kernel.kptr_restrict = 2

    # Enable ASLR
    kernel.randomize_va_space = 2

    # Restrict ptrace (prevent container escape via ptrace)
    kernel.yama.ptrace_scope = 2

    # Limit core dumps
    fs.suid_dumpable = 0
    SYSCTL

  - sysctl --system

  # ── 5. Create directory structure ──
  - mkdir -p /opt/nso/{data,config,vms,vm,venv}
  - chmod 700 /opt/nso/vms

  # ── 6. Python venv ──
  - python3 -m venv /opt/nso/venv
  - /opt/nso/venv/bin/pip install --upgrade pip
  - /opt/nso/venv/bin/pip install fastapi uvicorn httpx aiosqlite pydantic

  # ── 7. Agent config ──
  # The pool agent token is how the central server authenticates.
  # It's generated by register_host() and must match what's in the DB.
  - |
    cat > /opt/nso/config/agent.env << 'AGENT_ENV'
    NSO_ADMIN_EMAIL={{ADMIN_EMAIL}}
    AGENT_ADMIN_PASSWORD={{ADMIN_PASSWORD}}
    NSO_JWT_SECRET={{JWT_SECRET}}
    NSO_POOL_AGENT_TOKEN={{POOL_AGENT_TOKEN}}
    NSO_VM_DIR=/opt/nso/vms
    NSO_AGENT_HOST=127.0.0.1
    NSO_AGENT_PORT=8081
    AGENT_ENV

  - chmod 600 /opt/nso/config/agent.env

  # ── 8. Nginx — restrict agent access to central server only ──
  - apt-get install -y nginx
  - |
    cat > /etc/nginx/sites-available/nso-pool << 'NGINX_CONF'
    # Pool host nginx — agent proxy restricted to central server
    server {
        listen 8081 default_server;
        server_name _;
        server_tokens off;

        # Only allow central server
        allow {{CENTRAL_SERVER_IP}};
        deny all;

        location / {
            proxy_pass http://127.0.0.1:18081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;

            # Timeout for long operations (VM creation)
            proxy_read_timeout 120s;
        }
    }
    NGINX_CONF

  - ln -sf /etc/nginx/sites-available/nso-pool /etc/nginx/sites-enabled/nso-pool
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t && systemctl reload nginx

  # ── 9. Systemd service (agent runs as root — needs Docker/cgroup access) ──
  # Agent binds to 127.0.0.1:18081 (behind nginx which restricts by IP)
  - |
    cat > /etc/systemd/system/nso-agent.service << 'SERVICE'
    [Unit]
    Description=NSO Pool Agent
    After=network.target docker.service
    Requires=docker.service

    [Service]
    Type=simple
    WorkingDirectory=/opt/nso/vm/agent
    EnvironmentFile=/opt/nso/config/agent.env
    Environment=NSO_AGENT_PORT=18081
    ExecStart=/opt/nso/venv/bin/uvicorn main:app --host 127.0.0.1 --port 18081
    Restart=always
    RestartSec=5

    # Even though root, restrict what we can
    NoNewPrivileges=no
    ProtectHome=yes
    PrivateTmp=yes
    ProtectKernelModules=yes

    [Install]
    WantedBy=multi-user.target
    SERVICE

  - systemctl daemon-reload
  - systemctl enable nso-agent

  # ── 10. Default iptables rules for VM isolation ──
  # Block all VM-to-VM traffic by default (lateral movement prevention)
  - iptables -A FORWARD -s 10.0.0.0/8 -d 10.0.0.0/8 -j DROP
  - iptables -A FORWARD -s 172.16.0.0/12 -d 172.16.0.0/12 -j DROP
  # Allow established connections (for Docker networking)
  - iptables -I FORWARD -m state --state ESTABLISHED,RELATED -j ACCEPT
  - netfilter-persistent save

  # ── 11. SSH hardening ──
  - sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
  - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/^#\?X11Forwarding.*/X11Forwarding no/' /etc/ssh/sshd_config
  - sed -i 's/^#\?AllowTcpForwarding.*/AllowTcpForwarding no/' /etc/ssh/sshd_config
  - systemctl reload sshd

  # ── 12. Cleanup ──
  - apt-get clean
  - rm -rf /var/lib/apt/lists/*

final_message: "NSO pool host ready in $UPTIME seconds"
