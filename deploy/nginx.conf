upstream mms_api {
    server 127.0.0.1:8000;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name zarnetti.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name zarnetti.com;

    ssl_certificate /etc/letsencrypt/live/zarnetti.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zarnetti.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # API
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://mms_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://mms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Docs
    location /docs { proxy_pass http://mms_api; }
    location /openapi.json { proxy_pass http://mms_api; }

    # Dashboard
    location / {
        root /opt/mms/dashboard/static;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
}
