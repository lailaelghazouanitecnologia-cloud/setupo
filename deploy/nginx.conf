# Setupo - Nginx reverse proxy for zarnetti.com
# Serves: Dashboard (static) + API (FastAPI uvicorn)

upstream setupo_api {
    server 127.0.0.1:8000;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

server {
    listen 80;
    server_name zarnetti.com www.zarnetti.com;

    # Redirect to HTTPS (certbot will handle this after SSL setup)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name zarnetti.com www.zarnetti.com;

    # SSL (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/zarnetti.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zarnetti.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API proxy
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://setupo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # API docs
    location /docs {
        proxy_pass http://setupo_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://setupo_api;
    }

    # Dashboard (static files)
    location / {
        root /opt/setupo/server/dashboard/static;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Block common attack paths
    location ~ /\. { deny all; }
    location ~ ~$ { deny all; }

    access_log /var/log/nginx/setupo_access.log;
    error_log /var/log/nginx/setupo_error.log;
}
