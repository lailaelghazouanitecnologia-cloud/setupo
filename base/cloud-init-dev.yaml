#cloud-config
# Setupo — Instance type: DEV
# Full development environment with Docker, Node, Python, Go, Rust

package_update: true
package_upgrade: true

packages:
  - git
  - curl
  - wget
  - ufw
  - jq
  - rsync
  - unzip
  - build-essential
  - python3
  - python3-pip
  - python3-venv
  - tmux
  - htop
  - ca-certificates
  - gnupg

runcmd:
  # Firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 3000:9000/tcp
  - ufw --force enable

  # Install Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

  # Install Node.js 20
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs

  # Install Go
  - curl -fsSL https://go.dev/dl/go1.22.0.linux-amd64.tar.gz | tar -C /usr/local -xzf -
  - echo 'export PATH=$PATH:/usr/local/go/bin' >> /etc/profile.d/go.sh

  # Install Rust
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  - echo 'source /root/.cargo/env' >> /etc/profile.d/rust.sh

  # App directory
  - mkdir -p /opt/app

  # Ready marker
  - touch /opt/app/.setupo-ready
  - echo "Setupo dev instance ready" > /var/log/setupo-init.log
