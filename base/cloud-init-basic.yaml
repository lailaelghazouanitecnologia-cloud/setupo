#cloud-config
# Setupo v0.2 — AI Agent Infrastructure API
# Full stack: FastAPI backend + React dashboard

package_update: true

packages:
  - nginx
  - git
  - ufw
  - unzip
  - curl
  - python3
  - python3-venv
  - python3-pip
  - python3-dev
  - build-essential
  - certbot
  - python3-certbot-nginx
  - jq
  - rsync

write_files:
  - path: /etc/nginx/sites-available/setupo
    permissions: "0644"
    content: |
      upstream setupo_api {
          server 127.0.0.1:8000;
      }

      server {
          listen 80;
          server_name zarnetti.com www.zarnetti.com _;

          # API proxy
          location /api/ {
              proxy_pass http://setupo_api;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 300s;
          }

          # WebSocket proxy
          location /ws/ {
              proxy_pass http://setupo_api;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_read_timeout 86400s;
          }

          # FastAPI docs
          location /docs { proxy_pass http://setupo_api; }
          location /openapi.json { proxy_pass http://setupo_api; }
          location /redoc { proxy_pass http://setupo_api; }

          # React frontend
          root /var/www/setupo;
          index index.html;

          location / {
              try_files $uri $uri/ /index.html;
          }

          location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
              expires 30d;
              add_header Cache-Control "public, immutable";
          }
      }

  - path: /etc/systemd/system/setupo.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Setupo — AI Agent Infrastructure API
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/setupo
      Environment=PATH=/opt/setupo/venv/bin:/usr/local/bin:/usr/bin:/bin
      Environment=PYTHONPATH=/opt/setupo
      Environment=SETUPO_DATA_DIR=/opt/setupo/data
      Environment=SETUPO_CONFIG_DIR=/opt/setupo/config
      Environment=VULTR_API_KEY=VZKRXDOZ2KXVUMCSCZVFQXB4WJJCCCVDMSNA
      ExecStart=/opt/setupo/venv/bin/uvicorn server.main:app --host 127.0.0.1 --port 8000
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  - path: /opt/setupo-build.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euxo pipefail
      exec > /var/log/setupo-build.log 2>&1

      echo "=== Setupo v0.2 Deploy — $(date) ==="

      # Fallback page
      mkdir -p /var/www/setupo
      cat > /var/www/setupo/index.html <<'HTML'
      <!DOCTYPE html><html><head><title>Setupo - Building...</title>
      <style>body{background:#0a0a0f;color:#d0d0dc;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh}
      .c{text-align:center}h1{color:#7c9fff;font-size:2em}p{color:#6a6a82}</style></head>
      <body><div class="c"><h1>setupo</h1><p>Building API and dashboard... check back in a minute.</p></div></body></html>
      HTML

      # Setup nginx with fallback
      rm -f /etc/nginx/sites-enabled/default
      ln -sf /etc/nginx/sites-available/setupo /etc/nginx/sites-enabled/setupo
      nginx -t && systemctl restart nginx

      # Clone repo FIRST (target dir must not exist)
      rm -rf /opt/setupo
      git clone -b claude/setup-vultr-python-server-IuMfs \
        https://github.com/lailaelghazouanitecnologia-cloud/setupo.git /opt/setupo

      echo "Git clone OK"
      ls -la /opt/setupo/

      # Create data/config dirs AFTER clone
      mkdir -p /opt/setupo/config
      mkdir -p /opt/setupo/data

      # ---- BACKEND ----
      echo "=== Setting up Python backend ==="
      cd /opt/setupo
      python3 -m venv /opt/setupo/venv
      /opt/setupo/venv/bin/pip install --upgrade pip
      /opt/setupo/venv/bin/pip install -r /opt/setupo/requirements.txt

      echo "=== pip install complete ==="

      # Generate auth token
      /opt/setupo/venv/bin/python3 -c "
      import secrets, os
      os.makedirs('/opt/setupo/config', exist_ok=True)
      token = secrets.token_urlsafe(64)
      with open('/opt/setupo/config/token', 'w') as f:
          f.write(token)
      os.chmod('/opt/setupo/config/token', 0o600)
      print(f'Token generated: {token[:16]}...')
      "

      # Verify the app can import
      /opt/setupo/venv/bin/python3 -c "from server.main import app; print('App import OK, routes:', len(app.routes))"

      # Start backend
      systemctl daemon-reload
      systemctl enable setupo
      systemctl start setupo
      echo "Backend service started"

      # Wait for backend
      for i in $(seq 1 30); do
        if curl -s http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
          echo "Backend is healthy!"
          curl -s http://127.0.0.1:8000/api/health
          break
        fi
        echo "Waiting for backend... ($i/30)"
        sleep 2
      done

      # Show service status for debugging
      systemctl status setupo --no-pager || true
      journalctl -u setupo --no-pager -n 30 || true

      # ---- FRONTEND ----
      echo "=== Building React frontend ==="
      export HOME=/root
      curl -fsSL https://bun.sh/install | bash
      export BUN_INSTALL=/root/.bun
      export PATH=$BUN_INSTALL/bin:$PATH

      if [ -d /opt/setupo/workspaces/default ]; then
        cd /opt/setupo/workspaces/default
        bun install --no-save
        bun run build

        if [ -d /opt/setupo/workspaces/default/dist ]; then
          rm -rf /var/www/setupo/*
          cp -r /opt/setupo/workspaces/default/dist/* /var/www/setupo/
          echo "FRONTEND BUILD SUCCESS"
        else
          echo "FRONTEND BUILD FAILED - dist/ not found"
        fi
      else
        echo "No workspaces/default found, using dashboard/static"
        if [ -d /opt/setupo/dashboard/static ]; then
          cp -r /opt/setupo/dashboard/static/* /var/www/setupo/
        fi
      fi

      systemctl restart nginx

      # SSL (Cloudflare proxy might handle this, try anyway)
      certbot --nginx -d zarnetti.com --non-interactive --agree-tos -m admin@zarnetti.com --redirect 2>&1 || echo "Certbot skipped (likely Cloudflare proxied)"

      echo "=== Setupo deployment complete — $(date) ==="

runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - bash /opt/setupo-build.sh
