#cloud-config
# MMS - Clone repo, install Bun, build React app, serve via nginx

package_update: true

packages:
  - nginx
  - git
  - ufw
  - unzip
  - curl

write_files:
  - path: /etc/nginx/sites-available/mms
    permissions: "0644"
    content: |
      server {
          listen 80;
          server_name zarnetti.com www.zarnetti.com _;
          root /opt/mms/workspaces/default/dist;
          index index.html;

          location / {
              try_files $uri $uri/ /index.html;
          }

          # Cache static assets
          location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
              expires 30d;
              add_header Cache-Control "public, immutable";
          }
      }

runcmd:
  # Firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # Install Bun
  - curl -fsSL https://bun.sh/install | bash
  - ln -sf /root/.bun/bin/bun /usr/local/bin/bun
  - ln -sf /root/.bun/bin/bunx /usr/local/bin/bunx

  # Clone repo (specific branch)
  - git clone -b claude/setup-vultr-python-server-IuMfs https://github.com/lailaelghazouanitecnologia-cloud/setupo.git /opt/mms

  # Build the React app
  - cd /opt/mms/workspaces/default && bun install && bun run build

  # Enable nginx site
  - rm -f /etc/nginx/sites-enabled/default
  - ln -sf /etc/nginx/sites-available/mms /etc/nginx/sites-enabled/mms
  - nginx -t && systemctl restart nginx
