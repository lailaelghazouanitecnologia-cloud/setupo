#cloud-config
# Setupo — Cloud-init for Vultr VPS
# Bootstraps: Python + Setupo API server + Nginx reverse proxy

package_update: true
package_upgrade: true

packages:
  - python3
  - python3-pip
  - python3-venv
  - nginx
  - certbot
  - python3-certbot-nginx
  - ufw
  - git
  - curl
  - jq
  - ca-certificates

write_files:
  - path: /opt/setupo/.env
    permissions: "0600"
    content: |
      VULTR_API_KEY=I5LHJ37GZDZQYGUEMEJHOLSNQUAQ5FTNW3YA
      SETUPO_HOST=0.0.0.0
      SETUPO_PORT=8000
      SETUPO_DATA_DIR=/opt/setupo/data
      SETUPO_CONFIG_DIR=/opt/setupo/config
      SETUPO_CORS_ORIGINS=https://zarnetti.com,http://localhost:3000
      SETUPO_ADMIN_EMAIL=ayman_gha@hotmail.com

  - path: /etc/systemd/system/setupo.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Setupo — AI Agent Infrastructure API
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/setupo
      EnvironmentFile=/opt/setupo/.env
      ExecStart=/opt/setupo/venv/bin/uvicorn server.main:app --host 127.0.0.1 --port 8000 --workers 2
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 8000/tcp
  - ufw --force enable

  # Clone setupo
  - git clone https://github.com/lailaelghazouanitecnologia-cloud/setupo.git /opt/setupo/repo
  - cp -r /opt/setupo/repo/* /opt/setupo/
  - cp -r /opt/setupo/repo/.* /opt/setupo/ 2>/dev/null || true
  - rm -rf /opt/setupo/repo

  # Python virtual env
  - python3 -m venv /opt/setupo/venv
  - /opt/setupo/venv/bin/pip install --upgrade pip
  - /opt/setupo/venv/bin/pip install -r /opt/setupo/requirements.txt

  # Data dirs
  - mkdir -p /opt/setupo/data
  - mkdir -p /opt/setupo/config
  - mkdir -p /var/log/setupo

  # Nginx config
  - |
    cat > /etc/nginx/sites-available/setupo <<'NGINX'
    upstream setupo_api {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://setupo_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /docs {
            proxy_pass http://setupo_api;
        }

        location /openapi.json {
            proxy_pass http://setupo_api;
        }

        location /ws/ {
            proxy_pass http://setupo_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        location / {
            return 200 '{"status":"ok","service":"setupo"}';
            add_header Content-Type application/json;
        }
    }
    NGINX
  - ln -sf /etc/nginx/sites-available/setupo /etc/nginx/sites-enabled/setupo
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t && systemctl restart nginx

  # Start setupo
  - systemctl daemon-reload
  - systemctl enable setupo
  - systemctl start setupo
