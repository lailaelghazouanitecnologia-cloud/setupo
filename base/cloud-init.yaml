#cloud-config
# MMS - Micro Module System - Cloud-init for Vultr
# Bootstrap: Docker + MMS server + Dashboard at zarnetti.com

package_update: true
package_upgrade: true

packages:
  - python3
  - python3-pip
  - python3-venv
  - nginx
  - certbot
  - python3-certbot-nginx
  - ufw
  - git
  - curl
  - jq
  - ca-certificates
  - gnupg

write_files:
  - path: /etc/mms/config.yaml
    permissions: "0600"
    content: |
      domain: zarnetti.com
      api_port: 8000
      data_dir: /var/lib/mms
      log_dir: /var/log/mms

  - path: /etc/mms/generate_token.py
    permissions: "0700"
    content: |
      #!/usr/bin/env python3
      import secrets, os
      token = secrets.token_urlsafe(64)
      os.makedirs("/etc/mms", exist_ok=True)
      with open("/etc/mms/token", "w") as f:
          f.write(token)
      os.chmod("/etc/mms/token", 0o600)
      print("=" * 50)
      print("MMS ACCESS TOKEN")
      print(token)
      print("=" * 50)

runcmd:
  # Firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # Install Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

  # Generate token
  - python3 /etc/mms/generate_token.py

  # Clone MMS
  - git clone https://github.com/lailaelghazouanitecnologia-cloud/setupo.git /opt/mms

  # Python env
  - python3 -m venv /opt/mms/venv
  - /opt/mms/venv/bin/pip install -r /opt/mms/requirements.txt

  # Data dirs
  - mkdir -p /var/lib/mms/capsules
  - mkdir -p /var/log/mms

  # Pull base Docker images
  - docker pull python:3.12-slim
  - docker pull node:20-slim
  - docker pull alpine:3.19

  # Deploy nginx
  - cp /opt/mms/deploy/nginx.conf /etc/nginx/sites-available/mms
  - ln -sf /etc/nginx/sites-available/mms /etc/nginx/sites-enabled/mms
  - rm -f /etc/nginx/sites-enabled/default
  - systemctl restart nginx

  # Deploy systemd
  - cp /opt/mms/deploy/mms.service /etc/systemd/system/
  - systemctl daemon-reload
  - systemctl enable mms
  - systemctl start mms

  # SSL
  - certbot --nginx -d zarnetti.com --non-interactive --agree-tos -m admin@zarnetti.com || true
