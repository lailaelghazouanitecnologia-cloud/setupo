#cloud-config
# Setupo — Cloud-init template for VPS provisioning
# Placeholders replaced at runtime by types.py:
#   {{DOMAIN}}         → user's domain or "localhost"
#   {{VULTR_API_KEY}}  → Vultr API key from server config
#   {{CF_API_TOKEN}}   → Cloudflare API token
#   {{ADMIN_EMAIL}}    → admin email for certbot
#   {{ADMIN_PASSWORD}} → admin password for dashboard + agent
#   {{GIT_BRANCH}}     → branch to checkout (default: main)

bootcmd:
  # Flush Vultr default iptables FIRST (before anything else)
  # Vultr images ship with rules that block all except SSH
  - iptables -P INPUT ACCEPT
  - iptables -P FORWARD ACCEPT
  - iptables -P OUTPUT ACCEPT
  - iptables -F
  - iptables -X
  - ip6tables -P INPUT ACCEPT
  - ip6tables -P FORWARD ACCEPT
  - ip6tables -P OUTPUT ACCEPT
  - ip6tables -F
  - ip6tables -X

package_update: true
package_upgrade: false

packages:
  - python3
  - python3-pip
  - python3-venv
  - nginx
  - certbot
  - python3-certbot-nginx
  - ufw
  - git
  - curl
  - jq
  - ca-certificates
  - rsync

write_files:
  - path: /opt/setupo/.env
    permissions: "0600"
    content: |
      VULTR_API_KEY={{VULTR_API_KEY}}
      CF_API_TOKEN={{CF_API_TOKEN}}
      SETUPO_HOST=0.0.0.0
      SETUPO_PORT=8000
      SETUPO_DATA_DIR=/opt/setupo/data
      SETUPO_CONFIG_DIR=/opt/setupo/config
      SETUPO_WORKSPACES_DIR=/opt/setupo/workspaces
      SETUPO_CORS_ORIGINS=https://{{DOMAIN}},http://localhost:3000
      SETUPO_ADMIN_EMAIL={{ADMIN_EMAIL}}
      R2_ENDPOINT={{R2_ENDPOINT}}
      R2_ACCESS_KEY_ID={{R2_ACCESS_KEY_ID}}
      R2_SECRET_ACCESS_KEY={{R2_SECRET_ACCESS_KEY}}
      R2_BUCKET={{R2_BUCKET}}
      SETUPO_ADMIN_PASSWORD={{ADMIN_PASSWORD}}
      AGENT_ADMIN_PASSWORD={{ADMIN_PASSWORD}}
      NSO_AGENT_URL=http://127.0.0.1:8081
      NSO_ADMIN_EMAIL={{ADMIN_EMAIL}}

  - path: /etc/systemd/system/setupo.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Setupo — AI Agent Infrastructure API
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/setupo
      EnvironmentFile=/opt/setupo/.env
      ExecStart=/opt/setupo/venv/bin/uvicorn server.main:app --host 127.0.0.1 --port 8000 --workers 2
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/setupo-agent.service
    permissions: "0644"
    content: |
      [Unit]
      Description=NSO Agent — VPS management service
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/setupo/nso-agent
      EnvironmentFile=/opt/setupo/.env
      Environment=NSO_AGENT_HOST=0.0.0.0
      Environment=NSO_AGENT_PORT=8081
      ExecStart=/opt/setupo/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8081
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

  - path: /etc/nginx/sites-available/setupo
    permissions: "0644"
    content: |
      upstream setupo_api {
          server 127.0.0.1:8000;
      }

      upstream setupo_agent {
          server 127.0.0.1:8081;
      }

      server {
          listen 80;
          server_name {{DOMAIN}} *.{{DOMAIN}};

          # API
          location /api/ {
              proxy_pass http://setupo_api;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 300s;
          }

          location /docs {
              proxy_pass http://setupo_api;
          }

          location /openapi.json {
              proxy_pass http://setupo_api;
          }

          # WebSocket
          location /ws/ {
              proxy_pass http://setupo_api;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_read_timeout 86400s;
          }

          # Agent endpoints (auth, files, exec, metrics)
          location /agent/ {
              proxy_pass http://setupo_agent/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }

          # Dashboard (static HTML/CSS/JS)
          location / {
              root /opt/setupo/dashboard/static;
              index index.html;
              try_files $uri $uri/ /index.html;
          }
      }

runcmd:
  # ── Firewall (ufw replaces raw iptables flushed in bootcmd) ──
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 8081/tcp
  - ufw --force enable

  # ── Clone setupo (specific branch) ────────────────────────
  - git clone -b "{{GIT_BRANCH}}" https://github.com/lailaelghazouanitecnologia-cloud/setupo.git /opt/setupo/repo || git clone https://github.com/lailaelghazouanitecnologia-cloud/setupo.git /opt/setupo/repo
  - cp -r /opt/setupo/repo/* /opt/setupo/
  - cp -r /opt/setupo/repo/.* /opt/setupo/ 2>/dev/null || true
  - rm -rf /opt/setupo/repo

  # ── Python virtual env ────────────────────────────────────
  - python3 -m venv /opt/setupo/venv
  - /opt/setupo/venv/bin/pip install --upgrade pip
  - /opt/setupo/venv/bin/pip install -r /opt/setupo/requirements.txt
  - /opt/setupo/venv/bin/pip install -r /opt/setupo/nso-agent/requirements.txt

  # ── Node.js (for dashboard build) ─────────────────────────
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs

  # ── Data dirs ─────────────────────────────────────────────
  - mkdir -p /opt/setupo/data /opt/setupo/config /opt/setupo/workspaces /var/log/setupo /opt/app

  # ── Build dashboard (Next.js static export) ──────────────
  - cd /opt/setupo/dashboard && npm install && npm run build
  - mkdir -p /opt/setupo/dashboard/static
  - cp -r /opt/setupo/dashboard/out/* /opt/setupo/dashboard/static/

  # ── Activate nginx config ───────────────────────────────────
  - ln -sf /etc/nginx/sites-available/setupo /etc/nginx/sites-enabled/setupo
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t && systemctl restart nginx

  # ── Start agent first (for metrics tracking) ──────────────
  - systemctl daemon-reload
  - systemctl enable setupo-agent
  - systemctl start setupo-agent
  - sleep 2

  # ── Start setupo API ──────────────────────────────────────
  - systemctl enable setupo
  - systemctl start setupo

  # ── Diagnostics ──────────────────────────────────────────
  - sleep 3
  - 'echo "=== Agent ===" > /var/log/setupo/boot-diag.txt'
  - 'systemctl status setupo-agent --no-pager >> /var/log/setupo/boot-diag.txt 2>&1 || true'
  - 'echo "=== API ===" >> /var/log/setupo/boot-diag.txt'
  - 'systemctl status setupo --no-pager >> /var/log/setupo/boot-diag.txt 2>&1 || true'
  - 'echo "=== Nginx ===" >> /var/log/setupo/boot-diag.txt'
  - 'nginx -t >> /var/log/setupo/boot-diag.txt 2>&1 || true'
