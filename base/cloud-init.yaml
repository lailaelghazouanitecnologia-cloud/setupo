#cloud-config
# Setupo — Cloud-init template for VPS provisioning
# Placeholders replaced at runtime by types.py:
#   {{DOMAIN}}         → user's domain or "localhost"
#   {{VULTR_API_KEY}}  → Vultr API key from server config
#   {{CF_API_TOKEN}}   → Cloudflare API token
#   {{ADMIN_EMAIL}}    → admin email for certbot
#   {{GIT_BRANCH}}     → branch to checkout (default: main)

bootcmd:
  # Flush Vultr default iptables FIRST (before anything else)
  # Vultr images ship with rules that block all except SSH
  - iptables -P INPUT ACCEPT
  - iptables -P FORWARD ACCEPT
  - iptables -P OUTPUT ACCEPT
  - iptables -F
  - iptables -X
  - ip6tables -P INPUT ACCEPT
  - ip6tables -P FORWARD ACCEPT
  - ip6tables -P OUTPUT ACCEPT
  - ip6tables -F
  - ip6tables -X

package_update: true
package_upgrade: false

packages:
  - python3
  - python3-pip
  - python3-venv
  - nginx
  - certbot
  - python3-certbot-nginx
  - ufw
  - git
  - curl
  - jq
  - ca-certificates
  - rsync

write_files:
  - path: /opt/setupo/.env
    permissions: "0600"
    content: |
      VULTR_API_KEY={{VULTR_API_KEY}}
      CF_API_TOKEN={{CF_API_TOKEN}}
      SETUPO_HOST=0.0.0.0
      SETUPO_PORT=8000
      SETUPO_DATA_DIR=/opt/setupo/data
      SETUPO_CONFIG_DIR=/opt/setupo/config
      SETUPO_WORKSPACES_DIR=/opt/setupo/workspaces
      SETUPO_CORS_ORIGINS=https://{{DOMAIN}},http://localhost:3000
      SETUPO_ADMIN_EMAIL={{ADMIN_EMAIL}}

  - path: /etc/systemd/system/setupo.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Setupo — AI Agent Infrastructure API
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/setupo
      EnvironmentFile=/opt/setupo/.env
      ExecStart=/opt/setupo/venv/bin/uvicorn server.main:app --host 127.0.0.1 --port 8000 --workers 2
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  - path: /etc/nginx/sites-available/setupo
    permissions: "0644"
    content: |
      upstream setupo_api {
          server 127.0.0.1:8000;
      }

      server {
          listen 80;
          server_name {{DOMAIN}} *.{{DOMAIN}};

          location /api/ {
              proxy_pass http://setupo_api;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 300s;
          }

          location /docs {
              proxy_pass http://setupo_api;
          }

          location /openapi.json {
              proxy_pass http://setupo_api;
          }

          location /ws/ {
              proxy_pass http://setupo_api;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_read_timeout 86400s;
          }

          location / {
              return 200 '{"status":"ok","service":"setupo","docs":"/docs"}';
              add_header Content-Type application/json;
          }
      }

runcmd:
  # ── Firewall (ufw replaces raw iptables flushed in bootcmd) ──
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # ── Clone setupo (specific branch) ────────────────────────
  - BRANCH="{{GIT_BRANCH}}" && [ -z "$BRANCH" ] && BRANCH="main" && git clone -b "$BRANCH" https://github.com/lailaelghazouanitecnologia-cloud/setupo.git /opt/setupo/repo || git clone https://github.com/lailaelghazouanitecnologia-cloud/setupo.git /opt/setupo/repo
  - cp -r /opt/setupo/repo/* /opt/setupo/
  - cp -r /opt/setupo/repo/.* /opt/setupo/ 2>/dev/null || true
  - rm -rf /opt/setupo/repo

  # ── Python virtual env ────────────────────────────────────
  - python3 -m venv /opt/setupo/venv
  - /opt/setupo/venv/bin/pip install --upgrade pip
  - /opt/setupo/venv/bin/pip install -r /opt/setupo/requirements.txt

  # ── Data dirs ─────────────────────────────────────────────
  - mkdir -p /opt/setupo/data /opt/setupo/config /opt/setupo/workspaces /var/log/setupo /opt/app

  # ── Activate nginx config (file written by write_files) ───
  - ln -sf /etc/nginx/sites-available/setupo /etc/nginx/sites-enabled/setupo
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t && systemctl restart nginx

  # ── Start setupo service ──────────────────────────────────
  - systemctl daemon-reload
  - systemctl enable setupo
  - systemctl start setupo

  # ── SSL (skip if behind Cloudflare proxy or localhost) ────
  - DOMAIN="{{DOMAIN}}" && if [ "$DOMAIN" != "localhost" ] && [ -n "$DOMAIN" ]; then sleep 5 && certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos -m "{{ADMIN_EMAIL}}" --redirect || echo "WARN certbot failed"; fi
