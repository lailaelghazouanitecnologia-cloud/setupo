#cloud-config
# Setupo Base VM - Cloud-init for Vultr
# Deploys: Orchestrator + Dashboard + Firecracker MicroVMs

package_update: true
package_upgrade: true

packages:
  - python3
  - python3-pip
  - python3-venv
  - nginx
  - certbot
  - python3-certbot-nginx
  - ufw
  - git
  - curl
  - jq
  - qemu-kvm
  - libvirt-daemon-system
  - bridge-utils
  - iptables

write_files:
  - path: /etc/setupo/config.yaml
    permissions: "0600"
    content: |
      domain: zarnetti.com
      api_port: 8000
      dashboard_port: 8080
      microvm_subnet: 172.16.0.0/24
      vm_subnet: 10.10.0.0/24
      max_microvms: 50
      max_vms: 10
      capsule_dir: /opt/setupo/capsules
      data_dir: /var/lib/setupo
      log_dir: /var/log/setupo

  - path: /etc/setupo/generate_token.py
    permissions: "0700"
    content: |
      #!/usr/bin/env python3
      import secrets
      import os
      token = secrets.token_urlsafe(64)
      os.makedirs("/etc/setupo", exist_ok=True)
      with open("/etc/setupo/token", "w") as f:
          f.write(token)
      os.chmod("/etc/setupo/token", 0o600)
      print(f"===== SETUPO ACCESS TOKEN =====")
      print(f"{token}")
      print(f"===== SAVE THIS TOKEN NOW =====")

runcmd:
  # Firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 8000/tcp
  - ufw --force enable

  # Generate secure token
  - python3 /etc/setupo/generate_token.py

  # Clone repo
  - git clone https://github.com/lailaelghazouanitecnologia-cloud/setupo.git /opt/setupo

  # Setup Python environment
  - python3 -m venv /opt/setupo/venv
  - /opt/setupo/venv/bin/pip install -r /opt/setupo/requirements.txt

  # Create data directories
  - mkdir -p /var/lib/setupo/vms
  - mkdir -p /var/lib/setupo/microvms
  - mkdir -p /var/lib/setupo/capsules
  - mkdir -p /var/log/setupo

  # Install Firecracker for MicroVMs
  - bash /opt/setupo/base/install_firecracker.sh

  # Setup networking for VMs
  - bash /opt/setupo/base/setup_network.sh

  # Deploy nginx
  - cp /opt/setupo/deploy/nginx.conf /etc/nginx/sites-available/setupo
  - ln -sf /etc/nginx/sites-available/setupo /etc/nginx/sites-enabled/setupo
  - rm -f /etc/nginx/sites-enabled/default
  - systemctl restart nginx

  # Deploy systemd services
  - cp /opt/setupo/deploy/setupo.service /etc/systemd/system/
  - systemctl daemon-reload
  - systemctl enable setupo
  - systemctl start setupo

  # SSL (will work once DNS points to this IP)
  - certbot --nginx -d zarnetti.com --non-interactive --agree-tos -m admin@zarnetti.com || true
