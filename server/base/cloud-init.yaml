#cloud-config
# NSO — Cloud-init template for VPS provisioning
# Placeholders replaced at runtime by types.py:
#   {{DOMAIN}}         → user's domain or "localhost"
#   {{VULTR_API_KEY}}  → Vultr API key from server config
#   {{CF_API_TOKEN}}   → Cloudflare API token
#   {{ADMIN_EMAIL}}    → admin email for certbot
#   {{ADMIN_PASSWORD}} → admin password for dashboard + agent
#   {{GIT_BRANCH}}     → branch to checkout (default: master)

bootcmd:
  # Flush Vultr default iptables FIRST (before anything else)
  # Vultr images ship with rules that block all except SSH
  - iptables -P INPUT ACCEPT
  - iptables -P FORWARD ACCEPT
  - iptables -P OUTPUT ACCEPT
  - iptables -F
  - iptables -X
  - ip6tables -P INPUT ACCEPT
  - ip6tables -P FORWARD ACCEPT
  - ip6tables -P OUTPUT ACCEPT
  - ip6tables -F
  - ip6tables -X

package_update: true
package_upgrade: false

packages:
  - python3
  - python3-pip
  - python3-venv
  - nginx
  - certbot
  - python3-certbot-nginx
  - ufw
  - git
  - curl
  - jq
  - ca-certificates
  - rsync

write_files:
  - path: /opt/nso/.env
    permissions: "0600"
    content: |
      VULTR_API_KEY={{VULTR_API_KEY}}
      CF_API_TOKEN={{CF_API_TOKEN}}
      CF_NSO_ZONE_ID={{CF_NSO_ZONE_ID}}
      NSO_BASE_DOMAIN={{DOMAIN}}
      NSO_HOST=0.0.0.0
      NSO_PORT=8000
      NSO_DATA_DIR=/opt/nso/data
      NSO_CONFIG_DIR=/opt/nso/config
      NSO_WORKSPACES_DIR=/opt/nso/workspaces
      NSO_CORS_ORIGINS=https://{{DOMAIN}},https://sonfazt.{{DOMAIN}},http://localhost:3000
      NSO_ADMIN_EMAIL={{ADMIN_EMAIL}}
      R2_ENDPOINT={{R2_ENDPOINT}}
      R2_ACCESS_KEY_ID={{R2_ACCESS_KEY_ID}}
      R2_SECRET_ACCESS_KEY={{R2_SECRET_ACCESS_KEY}}
      R2_BUCKET={{R2_BUCKET}}
      NSO_ADMIN_PASSWORD={{ADMIN_PASSWORD}}
      AGENT_ADMIN_PASSWORD={{ADMIN_PASSWORD}}
      NSO_AGENT_URL=http://127.0.0.1:8081
      NSO_ADMIN_EMAIL={{ADMIN_EMAIL}}

  - path: /etc/systemd/system/nso.service
    permissions: "0644"
    content: |
      [Unit]
      Description=NSO — AI Agent Infrastructure API
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/nso
      EnvironmentFile=/opt/nso/.env
      ExecStart=/opt/nso/venv/bin/uvicorn server.main:app --host 127.0.0.1 --port 8000 --workers 2
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/nso-agent.service
    permissions: "0644"
    content: |
      [Unit]
      Description=NSO Agent — VPS management service
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/nso/instance
      EnvironmentFile=/opt/nso/.env
      Environment=NSO_AGENT_HOST=0.0.0.0
      Environment=NSO_AGENT_PORT=8081
      ExecStart=/opt/nso/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8081
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

  # ── Main site nginx (nso.dev) ──
  - path: /etc/nginx/sites-available/nso
    permissions: "0644"
    content: |
      upstream nso_api {
          server 127.0.0.1:8000;
      }

      upstream nso_agent {
          server 127.0.0.1:8081;
      }

      server {
          listen 80;
          server_name {{DOMAIN}} *.{{DOMAIN}};

          # API
          location /api/ {
              proxy_pass http://nso_api;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 300s;
          }

          location /docs {
              proxy_pass http://nso_api;
          }

          location /openapi.json {
              proxy_pass http://nso_api;
          }

          # WebSocket
          location /ws/ {
              proxy_pass http://nso_api;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_read_timeout 86400s;
          }

          # Agent endpoints (auth, files, exec, metrics)
          location /agent/ {
              proxy_pass http://nso_agent/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }

          # Dashboard (static HTML/CSS/JS)
          location / {
              root /opt/nso/client/dashboard/static;
              index index.html;
              try_files $uri $uri/ /index.html;
          }
      }

  # ── Admin panel nginx (sonfazt.nso.dev) ──
  - path: /etc/nginx/sites-available/sonfazt
    permissions: "0644"
    content: |
      server {
          listen 80;
          server_name sonfazt.{{DOMAIN}};

          # Admin API routes
          location /api/admin/ {
              proxy_pass http://nso_api;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 300s;
          }

          # Auth endpoint (needed for admin login)
          location /api/auth/ {
              proxy_pass http://nso_api;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          # Block all other API routes from admin subdomain
          location /api/ {
              return 403;
          }

          # Admin dashboard (static HTML/CSS/JS)
          location / {
              root /opt/nso/client/admin/static;
              index index.html;
              try_files $uri $uri/ /index.html;
          }

          location ~ /\. { deny all; }
      }

runcmd:
  # ── Firewall (ufw replaces raw iptables flushed in bootcmd) ──
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 8081/tcp
  - ufw --force enable

  # ── Clone repo (specific branch) ────────────────────────
  - git clone -b "{{GIT_BRANCH}}" https://github.com/lailaelghazouanitecnologia-cloud/setupo.git /opt/nso/repo || git clone https://github.com/lailaelghazouanitecnologia-cloud/setupo.git /opt/nso/repo
  - cp -r /opt/nso/repo/* /opt/nso/
  - cp -r /opt/nso/repo/.* /opt/nso/ 2>/dev/null || true
  - rm -rf /opt/nso/repo

  # ── Python virtual env ────────────────────────────────────
  - python3 -m venv /opt/nso/venv
  - /opt/nso/venv/bin/pip install --upgrade pip
  - /opt/nso/venv/bin/pip install -r /opt/nso/requirements.txt
  - /opt/nso/venv/bin/pip install -r /opt/nso/instance/requirements.txt

  # ── Node.js (for dashboard build) ─────────────────────────
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs

  # ── Data dirs ─────────────────────────────────────────────
  - mkdir -p /opt/nso/data /opt/nso/config /opt/nso/workspaces /var/log/nso /opt/app

  # ── Build main dashboard (Next.js static export) ──────────
  - cd /opt/nso/client/dashboard && npm install && npm run build
  - mkdir -p /opt/nso/client/dashboard/static
  - cp -r /opt/nso/client/dashboard/out/* /opt/nso/client/dashboard/static/

  # ── Build admin dashboard (Next.js static export) ─────────
  - cd /opt/nso/client/admin && npm install && npm run build
  - mkdir -p /opt/nso/client/admin/static
  - cp -r /opt/nso/client/admin/out/* /opt/nso/client/admin/static/

  # ── Activate nginx configs ────────────────────────────────
  - ln -sf /etc/nginx/sites-available/nso /etc/nginx/sites-enabled/nso
  - ln -sf /etc/nginx/sites-available/sonfazt /etc/nginx/sites-enabled/sonfazt
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t && systemctl restart nginx

  # ── Start agent first (for metrics tracking) ──────────────
  - systemctl daemon-reload
  - systemctl enable nso-agent
  - systemctl start nso-agent
  - sleep 2

  # ── Start NSO API ──────────────────────────────────────
  - systemctl enable nso
  - systemctl start nso

  # ── SSL certificates (certbot) ────────────────────────────
  - sleep 5
  - certbot --nginx -d {{DOMAIN}} --non-interactive --agree-tos --email {{ADMIN_EMAIL}} --redirect || true
  - certbot --nginx -d sonfazt.{{DOMAIN}} --non-interactive --agree-tos --email {{ADMIN_EMAIL}} --redirect || true

  # ── Diagnostics ──────────────────────────────────────────
  - sleep 3
  - 'echo "=== Agent ===" > /var/log/nso/boot-diag.txt'
  - 'systemctl status nso-agent --no-pager >> /var/log/nso/boot-diag.txt 2>&1 || true'
  - 'echo "=== API ===" >> /var/log/nso/boot-diag.txt'
  - 'systemctl status nso --no-pager >> /var/log/nso/boot-diag.txt 2>&1 || true'
  - 'echo "=== Nginx ===" >> /var/log/nso/boot-diag.txt'
  - 'nginx -t >> /var/log/nso/boot-diag.txt 2>&1 || true'
  - 'echo "=== SSL ===" >> /var/log/nso/boot-diag.txt'
  - 'certbot certificates >> /var/log/nso/boot-diag.txt 2>&1 || true'
