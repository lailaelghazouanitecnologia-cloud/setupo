#cloud-config
# NSO — Cloud-init template for VPS provisioning
# Placeholders replaced at runtime by types.py:
#   {{DOMAIN}}         → user's domain or "localhost"
#   {{VULTR_API_KEY}}  → Vultr API key from server config
#   {{CF_API_TOKEN}}   → Cloudflare API token
#   {{ADMIN_EMAIL}}    → admin email for certbot
#   {{ADMIN_PASSWORD}} → admin password for dashboard + agent
#   {{GIT_BRANCH}}     → branch to checkout (default: master)

bootcmd:
  # Flush Vultr default iptables FIRST (before anything else)
  # Vultr images ship with rules that block all except SSH
  - iptables -P INPUT ACCEPT
  - iptables -P FORWARD ACCEPT
  - iptables -P OUTPUT ACCEPT
  - iptables -F
  - iptables -X
  - ip6tables -P INPUT ACCEPT
  - ip6tables -P FORWARD ACCEPT
  - ip6tables -P OUTPUT ACCEPT
  - ip6tables -F
  - ip6tables -X

package_update: true
package_upgrade: false

packages:
  - python3
  - python3-pip
  - python3-venv
  - nginx
  - certbot
  - python3-certbot-nginx
  - ufw
  - git
  - curl
  - jq
  - ca-certificates
  - rsync

write_files:
  - path: /opt/nso/.env
    permissions: "0600"
    content: |
      VULTR_API_KEY={{VULTR_API_KEY}}
      CF_API_TOKEN={{CF_API_TOKEN}}
      CF_NSO_ZONE_ID={{CF_NSO_ZONE_ID}}
      NSO_BASE_DOMAIN={{DOMAIN}}
      NSO_HOST=0.0.0.0
      NSO_PORT=8000
      NSO_DATA_DIR=/opt/nso/data
      NSO_CONFIG_DIR=/opt/nso/config
      NSO_WORKSPACES_DIR=/opt/nso/workspaces
      NSO_CORS_ORIGINS=https://{{DOMAIN}},https://sonfazt.{{DOMAIN}},http://localhost:3000
      NSO_ADMIN_EMAIL={{ADMIN_EMAIL}}
      R2_ENDPOINT={{R2_ENDPOINT}}
      R2_ACCESS_KEY_ID={{R2_ACCESS_KEY_ID}}
      R2_SECRET_ACCESS_KEY={{R2_SECRET_ACCESS_KEY}}
      R2_BUCKET={{R2_BUCKET}}
      NSO_ADMIN_PASSWORD={{ADMIN_PASSWORD}}
      AGENT_ADMIN_PASSWORD={{ADMIN_PASSWORD}}
      NSO_AGENT_URL=http://127.0.0.1:8081
      NSO_JWT_SECRET={{JWT_SECRET}}

  - path: /etc/systemd/system/nso.service
    permissions: "0644"
    content: |
      [Unit]
      Description=NSO — AI Agent Infrastructure API
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/nso
      EnvironmentFile=/opt/nso/.env
      ExecStart=/opt/nso/venv/bin/uvicorn server.main:app --host 127.0.0.1 --port 8000 --workers 2
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/nso-agent.service
    permissions: "0644"
    content: |
      [Unit]
      Description=NSO Agent — VPS management service
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/nso/instance
      EnvironmentFile=/opt/nso/.env
      Environment=NSO_AGENT_HOST=0.0.0.0
      Environment=NSO_AGENT_PORT=8081
      ExecStart=/opt/nso/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8081
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

  # ── Self-signed cert generator (fallback for Cloudflare Full SSL) ──
  - path: /opt/nso/deploy/gen-self-signed.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      # Generate self-signed cert so nginx can always serve HTTPS
      # Cloudflare Full mode accepts self-signed on origin
      DOMAIN="${1:-localhost}"
      CERT_DIR="/etc/ssl/nso"
      mkdir -p "$CERT_DIR"
      if [ ! -f "$CERT_DIR/fullchain.pem" ]; then
        openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
          -keyout "$CERT_DIR/privkey.pem" \
          -out "$CERT_DIR/fullchain.pem" \
          -subj "/CN=$DOMAIN" \
          -addext "subjectAltName=DNS:$DOMAIN,DNS:*.$DOMAIN" 2>/dev/null
        echo "[nso] Self-signed cert generated for $DOMAIN"
      fi

  # ── Nginx with SSL from the start (self-signed → Let's Encrypt upgrade) ──
  - path: /etc/nginx/sites-available/nso
    permissions: "0644"
    content: |
      upstream nso_api {
          server 127.0.0.1:8000;
      }
      upstream nso_agent {
          server 127.0.0.1:8081;
      }
      server {
          listen 80;
          server_name {{DOMAIN}} *.{{DOMAIN}};
          location /.well-known/acme-challenge/ { root /var/www/html; }
          return 301 https://$host$request_uri;
      }
      server {
          listen 443 ssl;
          server_name {{DOMAIN}} *.{{DOMAIN}};
          ssl_certificate /etc/ssl/nso/fullchain.pem;
          ssl_certificate_key /etc/ssl/nso/privkey.pem;
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
          ssl_prefer_server_ciphers off;

          location /api/ {
              proxy_pass http://nso_api;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 300s;
          }
          location /docs { proxy_pass http://nso_api; }
          location /openapi.json { proxy_pass http://nso_api; }
          location /ws/ {
              proxy_pass http://nso_api;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_read_timeout 86400s;
          }
          location /agent/ {
              proxy_pass http://nso_agent/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
          location / {
              root /opt/nso/client/dashboard/static;
              index index.html;
              try_files $uri $uri/ /index.html;
          }
      }

  - path: /etc/nginx/sites-available/sonfazt
    permissions: "0644"
    content: |
      server {
          listen 80;
          server_name sonfazt.{{DOMAIN}};
          location /.well-known/acme-challenge/ { root /var/www/html; }
          return 301 https://$host$request_uri;
      }
      server {
          listen 443 ssl;
          server_name sonfazt.{{DOMAIN}};
          ssl_certificate /etc/ssl/nso/fullchain.pem;
          ssl_certificate_key /etc/ssl/nso/privkey.pem;
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
          ssl_prefer_server_ciphers off;
          add_header X-Robots-Tag "noindex, nofollow" always;

          location /api/admin/ {
              proxy_pass http://nso_api;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 300s;
          }
          location /api/auth/ {
              proxy_pass http://nso_api;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
          location /api/ { return 403; }
          location / {
              root /opt/nso/client/admin/static;
              index index.html;
              try_files $uri $uri/ /index.html;
          }
          location ~ /\.(?!well-known) { deny all; }
      }

  # ── Post-SSL nginx configs (written by setup script after certbot) ──
  # ── R2 download helper (for nso-ready pre-built images) ──
  - path: /opt/nso/deploy/r2-download.py
    permissions: "0755"
    content: |
      #!/usr/bin/env python3
      """Download a file from R2 using AWS4-HMAC-SHA256 signing."""
      import hashlib, hmac, os, sys, urllib.request
      from datetime import datetime, timezone
      from urllib.parse import quote

      def download(endpoint, bucket, key, access_key, secret_key, output):
          now = datetime.now(timezone.utc)
          date_stamp = now.strftime("%Y%m%d")
          amz_date = now.strftime("%Y%m%dT%H%M%SZ")
          host = endpoint.replace("https://", "").replace("http://", "")
          empty_hash = hashlib.sha256(b"").hexdigest()
          region, service = "auto", "s3"

          headers_to_sign = {"host": host, "x-amz-content-sha256": empty_hash, "x-amz-date": amz_date}
          signed_keys = sorted(headers_to_sign.keys())
          signed_headers = ";".join(signed_keys)
          canonical_headers = "".join(f"{k}:{headers_to_sign[k]}\n" for k in signed_keys)
          canonical = f"GET\n/{bucket}/{quote(key, safe='/')}\n\n{canonical_headers}\n{signed_headers}\n{empty_hash}"
          scope = f"{date_stamp}/{region}/{service}/aws4_request"
          sts = f"AWS4-HMAC-SHA256\n{amz_date}\n{scope}\n{hashlib.sha256(canonical.encode()).hexdigest()}"

          def _hmac(k, m):
              return hmac.new(k, m.encode(), hashlib.sha256).digest()
          sk = _hmac(_hmac(_hmac(_hmac(f"AWS4{secret_key}".encode(), date_stamp), region), service), "aws4_request")
          sig = hmac.new(sk, sts.encode(), hashlib.sha256).hexdigest()
          auth = f"AWS4-HMAC-SHA256 Credential={access_key}/{scope}, SignedHeaders={signed_headers}, Signature={sig}"

          url = f"{endpoint}/{bucket}/{quote(key, safe='/')}"
          req = urllib.request.Request(url, headers={
              "Authorization": auth, "x-amz-content-sha256": empty_hash, "x-amz-date": amz_date,
          })
          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  with open(output, "wb") as f:
                      while True:
                          chunk = resp.read(65536)
                          if not chunk:
                              break
                          f.write(chunk)
              return True
          except Exception as e:
              print(f"R2 download failed: {e}", file=sys.stderr)
              return False

      if __name__ == "__main__":
          if len(sys.argv) < 3:
              print("Usage: r2-download.py <bucket> <key> <output>")
              sys.exit(1)
          bucket, key, output = sys.argv[1], sys.argv[2], sys.argv[3]
          ep = os.environ.get("R2_ENDPOINT", "")
          ak = os.environ.get("R2_ACCESS_KEY_ID", "")
          sk = os.environ.get("R2_SECRET_ACCESS_KEY", "")
          if not all([ep, ak, sk]):
              print("R2 credentials not set", file=sys.stderr)
              sys.exit(1)
          ok = download(ep, bucket, key, ak, sk, output)
          sys.exit(0 if ok else 1)

  - path: /opt/nso/deploy/setup-ssl.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      # NSO SSL setup — upgrades nginx from self-signed to Let's Encrypt
      # If Let's Encrypt certs don't exist, keeps self-signed (Cloudflare Full works with both)
      set -e
      DOMAIN="{{DOMAIN}}"
      LE_DIR="/etc/letsencrypt/live"
      SS_DIR="/etc/ssl/nso"

      # Determine best cert for main domain
      if [ -f "$LE_DIR/$DOMAIN/fullchain.pem" ]; then
        CERT="$LE_DIR/$DOMAIN/fullchain.pem"
        KEY="$LE_DIR/$DOMAIN/privkey.pem"
        echo "Using Let's Encrypt cert for $DOMAIN"
      else
        CERT="$SS_DIR/fullchain.pem"
        KEY="$SS_DIR/privkey.pem"
        echo "Let's Encrypt not available for $DOMAIN — keeping self-signed"
      fi

      # ── Main site ──
      python3 -c "
      d, cert, key = '$DOMAIN', '$CERT', '$KEY'
      open('/etc/nginx/sites-available/nso','w').write(f'''upstream nso_api {{ server 127.0.0.1:8000; }}
      upstream nso_agent {{ server 127.0.0.1:8081; }}

      server {{
          listen 80;
          server_name {d} *.{d};
          location /.well-known/acme-challenge/ {{ root /var/www/html; }}
          return 301 https://\\\$host\\\$request_uri;
      }}

      server {{
          listen 443 ssl;
          server_name {d} *.{d};
          ssl_certificate {cert};
          ssl_certificate_key {key};
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
          ssl_prefer_server_ciphers off;

          location /api/ {{
              proxy_pass http://nso_api;
              proxy_set_header Host \\\$host;
              proxy_set_header X-Real-IP \\\$remote_addr;
              proxy_set_header X-Forwarded-For \\\$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto \\\$scheme;
              proxy_read_timeout 300s;
          }}
          location /docs {{ proxy_pass http://nso_api; }}
          location /openapi.json {{ proxy_pass http://nso_api; }}
          location /ws/ {{
              proxy_pass http://nso_api;
              proxy_http_version 1.1;
              proxy_set_header Upgrade \\\$http_upgrade;
              proxy_set_header Connection \\\"upgrade\\\";
              proxy_set_header Host \\\$host;
              proxy_read_timeout 86400s;
          }}
          location /agent/ {{
              proxy_pass http://nso_agent/;
              proxy_set_header Host \\\$host;
              proxy_set_header X-Real-IP \\\$remote_addr;
          }}
          location / {{
              root /opt/nso/client/dashboard/static;
              index index.html;
              try_files \\\$uri \\\$uri/ /index.html;
          }}
      }}
      ''')
      "

      # ── Admin site ──
      if [ -f "$LE_DIR/sonfazt.$DOMAIN/fullchain.pem" ]; then
        ADMIN_CERT="$LE_DIR/sonfazt.$DOMAIN/fullchain.pem"
        ADMIN_KEY="$LE_DIR/sonfazt.$DOMAIN/privkey.pem"
        echo "Using Let's Encrypt cert for sonfazt.$DOMAIN"
      else
        ADMIN_CERT="$SS_DIR/fullchain.pem"
        ADMIN_KEY="$SS_DIR/privkey.pem"
        echo "Using self-signed cert for sonfazt.$DOMAIN"
      fi

      python3 -c "
      d, cert, key = '$DOMAIN', '$ADMIN_CERT', '$ADMIN_KEY'
      open('/etc/nginx/sites-available/sonfazt','w').write(f'''server {{
          listen 80;
          server_name sonfazt.{d};
          location /.well-known/acme-challenge/ {{ root /var/www/html; }}
          return 301 https://\\\$host\\\$request_uri;
      }}

      server {{
          listen 443 ssl;
          server_name sonfazt.{d};
          ssl_certificate {cert};
          ssl_certificate_key {key};
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
          ssl_prefer_server_ciphers off;

          location /api/admin/ {{
              proxy_pass http://nso_api;
              proxy_set_header Host \\\$host;
              proxy_set_header X-Real-IP \\\$remote_addr;
              proxy_set_header X-Forwarded-For \\\$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto \\\$scheme;
              proxy_read_timeout 300s;
          }}
          location /api/auth/ {{
              proxy_pass http://nso_api;
              proxy_set_header Host \\\$host;
              proxy_set_header X-Real-IP \\\$remote_addr;
              proxy_set_header X-Forwarded-For \\\$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto \\\$scheme;
          }}
          location /api/ {{ return 403; }}
          location / {{
              root /opt/nso/client/admin/static;
              index index.html;
              try_files \\\$uri \\\$uri/ /index.html;
          }}
          location ~ /\\\\. {{ deny all; }}
      }}
      ''')
      "

      nginx -t && systemctl reload nginx
      echo "SSL nginx configs applied successfully"

runcmd:
  # ── Firewall (ufw replaces raw iptables flushed in bootcmd) ──
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 8081/tcp
  - ufw --force enable

  # ── Data dirs ─────────────────────────────────────────────
  - mkdir -p /opt/nso/data /opt/nso/config /opt/nso/workspaces /var/log/nso /opt/app /opt/nso/deploy /var/www/html

  # ── Generate self-signed cert (so nginx has SSL from the start) ──
  - /opt/nso/deploy/gen-self-signed.sh {{DOMAIN}}

  # ── Try nso-ready pre-built image first, fallback to git clone ──
  - |
    set -e
    export R2_ENDPOINT="{{R2_ENDPOINT}}"
    export R2_ACCESS_KEY_ID="{{R2_ACCESS_KEY_ID}}"
    export R2_SECRET_ACCESS_KEY="{{R2_SECRET_ACCESS_KEY}}"
    R2_READY_BUCKET="{{R2_READY_BUCKET}}"
    NSO_READY=0

    echo "[nso] Checking for pre-built system image..." | tee /var/log/nso/boot.log

    if python3 /opt/nso/deploy/r2-download.py "$R2_READY_BUCKET" "system/latest.zar" "/tmp/nso-system.zar" 2>>/var/log/nso/boot.log; then
      echo "[nso] Pre-built image found — extracting..." | tee -a /var/log/nso/boot.log
      cd /opt/nso
      tar xzf /tmp/nso-system.zar --strip-components=0 2>>/var/log/nso/boot.log || true

      # Move files/ contents to /opt/nso/
      if [ -d "/opt/nso/files" ]; then
        cp -r /opt/nso/files/* /opt/nso/ 2>/dev/null || true
        rm -rf /opt/nso/files
      fi
      rm -f /tmp/nso-system.zar
      NSO_READY=1
      echo "[nso] Pre-built image extracted successfully" | tee -a /var/log/nso/boot.log
    else
      echo "[nso] No pre-built image available — cloning from git..." | tee -a /var/log/nso/boot.log

      git clone -b "{{GIT_BRANCH}}" https://github.com/lailaelghazouanitecnologia-cloud/setupo.git /opt/nso/repo || \
        git clone https://github.com/lailaelghazouanitecnologia-cloud/setupo.git /opt/nso/repo
      cp -r /opt/nso/repo/* /opt/nso/
      cp -r /opt/nso/repo/.* /opt/nso/ 2>/dev/null || true
      rm -rf /opt/nso/repo
    fi

    # Python venv (always needed — venv is platform-specific)
    python3 -m venv /opt/nso/venv
    /opt/nso/venv/bin/pip install --upgrade pip
    /opt/nso/venv/bin/pip install -r /opt/nso/requirements.txt
    /opt/nso/venv/bin/pip install -r /opt/nso/instance/requirements.txt

    # Build dashboards only if NOT from nso-ready (nso-ready includes pre-built static)
    if [ "$NSO_READY" = "0" ]; then
      echo "[nso] Building dashboards from source..." | tee -a /var/log/nso/boot.log
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs

      cd /opt/nso/client/dashboard && npm install && npm run build
      mkdir -p /opt/nso/client/dashboard/static
      cp -r /opt/nso/client/dashboard/out/* /opt/nso/client/dashboard/static/

      cd /opt/nso/client/admin && npm install && npm run build
      mkdir -p /opt/nso/client/admin/static
      cp -r /opt/nso/client/admin/out/* /opt/nso/client/admin/static/
    else
      echo "[nso] Using pre-built dashboards from nso-ready" | tee -a /var/log/nso/boot.log
    fi

  # ── Activate nginx configs ────────────────────────────────
  - ln -sf /etc/nginx/sites-available/nso /etc/nginx/sites-enabled/nso
  - ln -sf /etc/nginx/sites-available/sonfazt /etc/nginx/sites-enabled/sonfazt
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t && systemctl restart nginx

  # ── Start agent first (for metrics tracking) ──────────────
  - systemctl daemon-reload
  - systemctl enable nso-agent
  - systemctl start nso-agent
  - sleep 2

  # ── Start NSO API ──────────────────────────────────────
  - systemctl enable nso
  - systemctl start nso

  # ── SSL certificates (certonly — no nginx rewrite) ────────
  - sleep 5
  - mkdir -p /var/www/html
  - certbot certonly --webroot -w /var/www/html -d {{DOMAIN}} --non-interactive --agree-tos --email {{ADMIN_EMAIL}} || true
  - certbot certonly --webroot -w /var/www/html -d sonfazt.{{DOMAIN}} --non-interactive --agree-tos --email {{ADMIN_EMAIL}} || true

  # ── Apply SSL nginx configs (uses our own templates, not certbot's) ──
  - /opt/nso/deploy/setup-ssl.sh || true

  # ── Deploy user app (if source provided) ─────────────────
  - |
    APP_GIT_URL="{{APP_GIT_URL}}"
    APP_GIT_BRANCH="{{APP_GIT_BRANCH}}"
    APP_DIR="/opt/app"

    if [ -n "$APP_GIT_URL" ]; then
      echo "[nso] Cloning app repo: $APP_GIT_URL (branch: $APP_GIT_BRANCH)" | tee /var/log/nso/app-deploy.log
      git clone -b "$APP_GIT_BRANCH" "$APP_GIT_URL" "$APP_DIR" >> /var/log/nso/app-deploy.log 2>&1 || \
        git clone "$APP_GIT_URL" "$APP_DIR" >> /var/log/nso/app-deploy.log 2>&1

      cd "$APP_DIR"

      # Auto-detect stack and install
      if [ -f "package.json" ]; then
        echo "[nso] Detected Node.js project — running npm install" >> /var/log/nso/app-deploy.log
        npm install >> /var/log/nso/app-deploy.log 2>&1
        # Build if build script exists
        node -e "const p=require('./package.json'); process.exit(p.scripts&&p.scripts.build?0:1)" 2>/dev/null && \
          npm run build >> /var/log/nso/app-deploy.log 2>&1 || true
      fi

      if [ -f "requirements.txt" ]; then
        echo "[nso] Detected Python project — installing deps" >> /var/log/nso/app-deploy.log
        python3 -m venv "$APP_DIR/venv" >> /var/log/nso/app-deploy.log 2>&1
        "$APP_DIR/venv/bin/pip" install -r requirements.txt >> /var/log/nso/app-deploy.log 2>&1
      fi

      if [ -f "Dockerfile" ]; then
        echo "[nso] Detected Dockerfile — available for docker build" >> /var/log/nso/app-deploy.log
      fi

      echo "[nso] App deployed to $APP_DIR" >> /var/log/nso/app-deploy.log
    fi

  # ── Diagnostics ──────────────────────────────────────────
  - sleep 3
  - 'echo "=== Agent ===" > /var/log/nso/boot-diag.txt'
  - 'systemctl status nso-agent --no-pager >> /var/log/nso/boot-diag.txt 2>&1 || true'
  - 'echo "=== API ===" >> /var/log/nso/boot-diag.txt'
  - 'systemctl status nso --no-pager >> /var/log/nso/boot-diag.txt 2>&1 || true'
  - 'echo "=== Nginx ===" >> /var/log/nso/boot-diag.txt'
  - 'nginx -t >> /var/log/nso/boot-diag.txt 2>&1 || true'
  - 'echo "=== SSL ===" >> /var/log/nso/boot-diag.txt'
  - 'certbot certificates >> /var/log/nso/boot-diag.txt 2>&1 || true'
  - 'echo "=== App ===" >> /var/log/nso/boot-diag.txt'
  - 'cat /var/log/nso/app-deploy.log >> /var/log/nso/boot-diag.txt 2>&1 || true'
